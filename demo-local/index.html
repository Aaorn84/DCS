<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>电子球童 · 交互演示</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f0f4ef;color:#183a2c;font:16px/1.7 system-ui}main{max-width:1100px;margin:40px auto;padding:24px}h1{font-size:38px;margin:4px 0}small{color:#62776b}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin-top:24px}.card{background:white;border-radius:20px;padding:25px;box-shadow:0 5px 25px #153c2810}button{background:#195e43;color:white;border:0;border-radius:10px;padding:11px 17px;cursor:pointer;font:inherit;margin:5px 5px 5px 0}button:disabled{opacity:.4;cursor:wait}.secondary{background:#e9f1eb;color:#24523d}input{padding:12px;border:1px solid #c9d7cd;border-radius:9px;font:inherit;width:100%}#chat{height:300px;overflow:auto;margin:18px 0}.bubble{padding:10px 15px;border-radius:12px;margin:8px 0;background:#f0f5ef}.me{background:#e1eee7;margin-left:40px}.note{background:#fff4db;padding:12px;border-radius:10px;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:320px;overflow:auto}#score{font-size:24px;font-weight:700}@media(max-width:750px){.grid{grid-template-columns:1fr}main{margin:0}h1{font-size:29px}}</style>
<main><small>LOCAL DEMO · 真实状态机 / 模拟位置 / 文字转写</small><h1>你的电子球童，先陪你打一洞。</h1><p>体验询距 → 报成绩 → 补充推杆与罚杆 → 确认 → 撤销。没有调用麦克风或手机定位。</p>
<div class="note">当前是合成的四杆洞，不是凤凰山实测地图。网页连接已有本地API，展示确定性流程；尚未接入完整自然语言伙伴与教练功能。</div>
<div class="grid"><section class="card"><button id="start">开始一场演示</button><button class="secondary" id="auto">自动演示一洞</button><span id="status">尚未开始</span><div id="chat" aria-live="polite"></div><form id="form"><input id="input" placeholder="输入：还有多少米" autocomplete="off"><button type="submit">发送</button></form><div id="quick"></div></section>
<section class="card"><small>已确认的记分</small><div id="score">尚未提交</div><p>当前球洞：第1洞 · Par 4<br>设备位置：模拟 WGS84 · 精度2米<br>目标：合成果岭中心参考点</p><details open><summary>状态引擎记录</summary><pre id="state">开始后显示；草稿不会冒充正式成绩。</pre></details></section></div></main>
<script>
let token,round,busy=false;const $=id=>document.getElementById(id);function line(who,text){const n=document.createElement('div');n.className='bubble'+(who==='你'?' me':'');n.textContent=who+'：'+text;$('chat').append(n);$('chat').scrollTop=$('chat').scrollHeight}function lock(v){busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v)}
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||JSON.stringify(d));return d}
function render(s){$('state').textContent=JSON.stringify(s.facts,null,2);const total=s.facts['holes.1.total'];const putts=s.facts['holes.1.putts'];$('score').textContent=total?.valid&&total.value!=null?`第1洞 ${total.value}杆${putts?.value!=null?' · '+putts.value+'推':''}`:'尚未提交 / 已撤销';$('status').textContent='已连接 · 状态版本 '+s.version}
async function event(type,extra){const id=crypto.randomUUID();const d=await api('/round-state',{action:'event',round_id:round,operation_id:id,event:{type,event_id:id,observed_at:new Date().toISOString(),...extra}});render(d.state);return d.result}
async function start(){const id=crypto.randomUUID();token=null;token=(await api('/auth/register',{email:'demo-'+id+'@example.test',password:crypto.randomUUID()})).token;round='demo-'+id;const d=await api('/round-state',{action:'create',round_id:round});render(d.state);$('chat').textContent='';await event('course',{data:{course_id:'synthetic',map_version:'1',crs:'WGS84',synthetic:true,holes:[{number:1,par:4,bbox:[120.999,30.999,121.004,31.002],objects:[{id:'g1',kind:'green_center',latitude:31.001,longitude:121.003}]}]}});await event('gps',{data:{latitude:31,longitude:121.001,accuracy_m:2}});line('球童','模拟球局已就绪。你可以问“还有多少米”，或报“这洞六杆”。')}
async function say(text){if(!round)await start();line('你',text);const r=await event('voice',{text});line('球童',r.text||'已处理；本轮没有语音回复。')}
async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){line('系统',e.message)}finally{lock(false)}}
$('start').onclick=()=>run(start);$('auto').onclick=()=>run(async()=>{await start();for(const t of ['还有多少米','这洞六杆','两推','没有罚杆','确认'])await say(t)});$('form').onsubmit=e=>{e.preventDefault();const t=$('input').value.trim();if(!t)return;$('input').value='';run(()=>say(t))};for(const t of ['还有多少米','这洞六杆','两推','没有罚杆','确认','撤销上一条记分']){const b=document.createElement('button');b.className='secondary';b.textContent=t;b.onclick=()=>run(()=>say(t));$('quick').append(b)}
</script></html>
